[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "founder-interview"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic-settings>=2.6,<3", "httpx>=0.28,<1", "google-cloud-firestore>=2.20,<3", "livekit-api>=1,<2", "openai>=2,<3", "python-dotenv>=1,<2", "PyJWT>=2.10,<3"]
[project.optional-dependencies]
voice = ["livekit-agents[deepgram,elevenlabs,silero]==1.8.5"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
typing = ["mypy>=1.15,<3"]
[tool.setuptools.packages.find]
include = ["app*", "voice*"]
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
files = ["app", "voice", "scripts", "tests"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
